name: meta

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'pages/**'
      - 'scripts/gen-meta.mjs'
      - '.github/workflows/meta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # purge 要 diff push 前后的 commit，需要完整历史

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate meta.json
        run: node scripts/gen-meta.mjs

      - name: Validate meta.json
        run: |
          node -e "
            const m = require('./meta.json');
            const need = ['version','generated_at','commit','site','counts','articles','pages','tags'];
            for (const k of need) if (!(k in m)) throw new Error('meta.json missing ' + k);
            if (m.articles.some(a => !a.slug || !a.date || !a.url)) throw new Error('bad article entry');
            if (m.articles.some(a => typeof a.hash !== 'string' || !/^[0-9a-f]{16}$/.test(a.hash))) throw new Error('bad article hash (need sha256 hex[:16])');
            if (m.counts.articles !== m.articles.length) throw new Error('counts.articles mismatch');
            if (m.counts.tags !== m.tags.length) throw new Error('counts.tags mismatch');
            if (m.counts.pages !== m.pages.length) throw new Error('counts.pages mismatch');
            console.log('meta.json ok:', m.counts);
          "

      - name: Commit if changed
        run: |
          if git diff --quiet -- meta.json; then
            echo 'meta.json unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta.json
          git commit -m 'chore(meta): regenerate meta.json [skip ci]'
          git push origin HEAD:main
      # jsDelivr 边缘缓存：不主动清会滞后（raw 那边约 5 分钟、jsDelivr 更久）。
      # 站点运行时优先读 jsDelivr，所以每次回提 meta.json 后清一次，保证 push 后秒级可见。
      - name: Purge jsDelivr cache (changed files)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # 本步骤在 meta 回提之后执行，HEAD 已经是 meta 提交，
          # 必须用 push 事件的 before..after 区间，不能用 HEAD~1。
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "$BEFORE" "$AFTER" -- posts pages 2>/dev/null || true)
          else
            files=$(git diff --name-only HEAD~1 HEAD -- posts pages 2>/dev/null || true)
          fi
          echo "changed: $files"
          for f in $files; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/K-Blaaaack/articles@main/$f" >/dev/null || true
            echo "purged $f"
          done
          curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/K-Blaaaack/articles@main/meta.json" >/dev/null || true
          echo "purged meta.json"